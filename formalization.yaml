version: "0.3.0"
project:
  name: "Graph Puzzles in Lean"
  authors: ["Nikolay Ulyanov"]
  responsible_maintainers: ["Nikolay Ulyanov"]
  license: "Apache-2.0"
classification:
  arxiv: [math.CO]
  msc2020: [05C45, 05C70]
sources:
  - title: "Graph Puzzles III.1: A proof of Sabidussi's compatibility conjecture with 4 colours"
    authors: ["Nikolay Ulyanov"]
    id: "papers/sabidussi/sabidussi_proof.pdf"
    type: "paper"
    relationship: "formalizes"
    note: "Four-colouring and compatible circuit decompositions; the PDF is the supplied local arXiv v2 submission."
  - title: "OpenAI cycle double cover formalization"
    authors: ["OpenAI"]
    id: "https://github.com/openai/cdc-lean/tree/577e9d9ea326d520f80672ee69b830bf1d513df5"
    type: "software"
    relationship: "uses"
    note: >-
      The pinned eight-flow, affine-pair and cubic-expansion proofs are composed
      with the endpoint graph model. Loops are restored in exactly two layers
      and the layers are decomposed into ordinary circuits.
  - title: "Graph Puzzles III.2-preview: Strong five-cycle double covers"
    authors: ["Nikolay Ulyanov + AI-Slop"]
    id: "papers/strong-five-cdc/strong_five_cycle_double_covers.tex"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Prescribed circuit extension, critical and permutation cubic graphs,
      the single induced hexagon construction, and numerical colouring defect three.
      The source and matching PDF retain the supplied title and attribution.
  - title: "Graph Puzzles IV.1-preview: Factorisations of hypohamiltonian and permutation snarks"
    authors: ["Nikolay Ulyanov + AI-Slop"]
    id: "papers/factorisations/unique_factorisation_snarks.tex"
    type: "paper"
    relationship: "formalizes"
    note: >-
      Unique terminal factor multisets, including multiplicities; preservation of the
      hypohamiltonian, permutation and intersection classes at every decomposition;
      Hamilton-cycle descent and the general good-class criterion.
      Section 6 order-counting corollaries are not separate Lean declarations in this release.
